name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: multigent
          POSTGRES_PASSWORD: multigent
          POSTGRES_DB: multigent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U multigent" --health-interval 3s
          --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s
          --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://multigent:multigent@localhost:5432/multigent_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy app tests
      - name: Tests
        run: uv run pytest -q
      - name: OpenAPI schema is committed and current
        run: uv run python -m app.openapi_export > /tmp/openapi.json && diff -u ../web/openapi.json /tmp/openapi.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @multigent/web lint
      - run: pnpm --filter @multigent/web typecheck
      - run: pnpm --filter @multigent/web test
      - run: pnpm --filter @multigent/web build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t multigent-api apps/api
      - run: docker build -t multigent-web apps/web

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack (api, worker, web, postgres, redis)
        run: |
          docker compose up -d --build
          for url in http://localhost:8000/readyz http://localhost:3000/login; do
            for i in $(seq 1 60); do curl -fsS "$url" >/dev/null && break; sleep 2; done
            curl -fsS "$url" >/dev/null
          done
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @multigent/web exec playwright install --with-deps chromium
      - name: Playwright (3 browsers in one chat, reconnect, queueing, axe)
        run: pnpm --filter @multigent/web e2e
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail=200 api worker
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
